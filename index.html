<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大阪京都">
<meta name="theme-color" content="#FFFCF5">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>大阪・京都 七日</title>
<style>
:root{--bg:#EAF3FA;--ink:#2B2B2B;--org:#F5A623;--orgl:#FFF0CF;--sub:#66727F;--line:#C8D6E3;--soft:#FFF0CF;--red:#D9482B;--fs:17px;--stick:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
html.big{--fs:20px}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.hand{font-family:"Yusei Magic","Zen Maru Gothic","PingFang TC","Microsoft JhengHei",sans-serif}
.round{font-family:"Zen Maru Gothic","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:.35em 1em;min-height:42px;cursor:pointer}
button:active{transform:translateY(2px);background:var(--orgl)}
button.primary{background:var(--org);font-weight:700}
button.danger{color:var(--red);border-color:var(--red)}
button.ghost{border-color:transparent;color:var(--sub);background:transparent}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:.55em .8em;border:2px solid var(--ink);border-radius:14px;background:#fff;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:3px 3px 0 var(--org)}
textarea{min-height:5em;resize:vertical}
label{display:block;font-size:.82rem;color:var(--sub);margin:1em 0 .25em;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.hide{display:none!important}
.small{font-size:.8rem;color:var(--sub)}
.ic{stroke:var(--ink);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none;vertical-align:middle}
.ic .o{fill:var(--ico,var(--org))}
.ic .w{fill:#fff}

#head{background:linear-gradient(#CFE3F3,var(--bg))}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
/* ===== 頂端插畫 ===== */
.art{position:relative;max-width:440px;height:220px;margin:calc(8px + env(safe-area-inset-top)) auto 0}
.art .blob{position:absolute;left:5%;top:12%;width:90%;height:78%}
.art .blob path{fill:var(--org);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.art .dc{position:absolute;line-height:0}
.ttl{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;width:80%}
.ttl .oko{font-size:.95rem;transform:rotate(-7deg);display:inline-block;margin-bottom:-.2em;color:var(--ink)}
.ttl h1{margin:0;font-size:2.3rem;line-height:1.15;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;letter-spacing:.04em;font-weight:900}
.ttl .kyo{font-size:.72rem;font-weight:700;letter-spacing:.06em;margin-top:.3em;white-space:nowrap}
.top2{padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.mini{display:flex;align-items:center;gap:.5em}
.mini h1{margin:0;font-size:1.5rem;font-weight:900}
.infobar{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:2px dashed var(--ink);border-bottom:2px dashed var(--ink);padding:.5em 0;margin-top:6px;flex-wrap:wrap}
.infobar .cnt{font-size:.95rem;font-weight:700}
.infobar .cnt b{font-size:1.4em;background:var(--org);border:2px solid var(--ink);border-radius:10px;padding:0 .35em;margin:0 .15em}
.infobar .btns{display:flex;gap:6px;align-items:center}
.infobar button,.top2 button{min-height:36px;font-size:.85rem;padding:.1em .8em}
button.on{background:var(--org);font-weight:700}
.banner{background:var(--orgl);border:2px dashed var(--ink);border-radius:14px;padding:.6em .9em;margin-top:10px;font-size:.86rem}

.stick{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:2px solid var(--ink)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 14px;scrollbar-width:none;max-width:720px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:.15em .95em;font-size:.9rem;white-space:nowrap;line-height:1.2;font-weight:700}
.chip.on{background:var(--org)}
.chip.pk{font-weight:500}
.chip.pk.on{background:var(--orgl);font-weight:700}
.dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;border:1.5px solid var(--ink)}

/* ===== 每一天 ===== */
.day{margin-top:34px;background:#fff;border:2.5px solid var(--ink);border-radius:24px 20px 26px 18px / 20px 26px 18px 24px;box-shadow:5px 5px 0 var(--org);padding:0 12px 12px;scroll-margin-top:var(--stick)}
.dayh{position:sticky;top:var(--stick);z-index:10;margin:0 -12px;background:var(--org);color:var(--ink);border-bottom:2.5px solid var(--ink);border-radius:21px 17px 0 0 / 17px 23px 0 0;padding:.5em 5em .55em 1em;min-height:4.2em;--ico:#fff}
.dayh .row1{display:flex;align-items:center;gap:.55em;flex-wrap:wrap}
.dayh .badge{background:var(--ink);color:#fff;font-size:.9rem;letter-spacing:.08em;padding:.05em .65em;border-radius:999px;transform:rotate(-4deg);display:inline-block}
.dayh .n{font-size:1.45rem;font-weight:900;line-height:1.2}
.dayh .d{font-size:.9rem;font-weight:700}
.dayh .t{font-size:.95rem;font-weight:700;margin-top:.1em}
.dayh .dic{position:absolute;right:.8em;top:50%;transform:translateY(-50%);line-height:0}
.today{box-shadow:5px 5px 0 var(--ink)}
.today .dayh .n::after{content:"今天";margin-left:.5em;font-size:.7rem;background:#fff;border:2px solid var(--ink);padding:.05em .55em;border-radius:999px;vertical-align:.25em}

.items{counter-reset:it}
.item{counter-increment:it;position:relative;padding:.75em .2em .75em 2.7em;border-bottom:2px dashed var(--line)}
.item:last-child{border-bottom:0}
.item::before{content:counter(it);position:absolute;left:.1em;top:.85em;width:1.8em;height:1.8em;border-radius:50%;background:var(--org);border:2px solid var(--ink);font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.title{font-size:1.02rem;font-weight:500;word-break:break-word}
.note{font-size:.88rem;margin-top:.15em;white-space:pre-wrap;word-break:break-word;color:var(--sub)}
.who{margin-top:.4em;font-size:.82rem;display:flex;flex-wrap:wrap;gap:.3em .5em}
.who>span{border:1.5px solid var(--ink);border-radius:999px;padding:.02em .7em;background:#fff}
.btns2{display:flex;flex-wrap:wrap;gap:7px;margin-top:.6em}
.btns2 button{min-height:40px;font-size:.88rem;padding:.15em .9em;display:inline-flex;align-items:center;gap:.3em}
.empty{color:var(--sub);padding:1em .3em;font-size:.9rem}
.dayfoot{display:flex;flex-wrap:wrap;gap:8px;padding:.9em 0 .2em}

.page{padding-top:12px}
.addrow{display:flex;gap:8px;margin:12px 0}
.addrow input{flex:1}
.todo{display:flex;align-items:center;gap:10px;padding:.55em .8em;margin-top:10px;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--org)}
.todo .tx{flex:1;word-break:break-word}
.todo.done .tx{text-decoration:line-through;opacity:.4}
.ck{flex:none;width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.todo.done .ck{background:var(--org)}
.memo{background:#fff;border:2.5px solid var(--ink);border-radius:20px 16px 22px 14px;padding:.8em 1.1em;margin:14px 0;box-shadow:4px 4px 0 var(--org)}
.memo h3{margin:0 0 .3em;font-size:1.05rem;display:inline-block;background:var(--orgl);padding:0 .6em;border-radius:8px}
.memo .body{white-space:pre-wrap;word-break:break-word;font-size:.92rem}

nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;background:#fff;border:2.5px solid var(--ink);border-radius:24px;display:flex;padding:5px;gap:4px;box-shadow:4px 4px 0 var(--org);max-width:700px;margin:0 auto}
nav button{flex:1;border:2px solid transparent;min-height:56px;font-size:.88rem;color:var(--ink);border-radius:18px;background:transparent;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:.2em}
nav button.on{background:var(--org);border-color:var(--ink);font-weight:800}
nav .bd{display:inline-block;min-width:1.4em;margin-left:.3em;font-size:.72rem;background:var(--ink);color:#fff;border-radius:10px;padding:0 .4em}

#modal{position:fixed;inset:0;z-index:50;background:rgba(43,43,43,.5);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));border:2.5px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0}
.sheet h3{margin:0 0 4px;font-size:1.2rem;font-weight:900}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1}
.fl{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:.3em .3em .3em .8em;margin-top:6px;font-size:.9rem;word-break:break-all}
.tkadd{border:2px dashed var(--ink);border-radius:16px;padding:.6em .9em .9em;margin-top:8px;background:#fff}

#viewer{position:fixed;inset:0;z-index:60;background:#fff;color:#000;display:none;flex-direction:column}
#viewer.show{display:flex}
#viewer .vh{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:2px solid var(--ink);gap:8px}
#viewer .vb{flex:1;overflow:auto;padding:12px;text-align:center}
#viewer .vt{margin:0 auto 22px;max-width:520px}
#viewer .vt b{display:block;font-size:1.05rem;margin-bottom:8px}
#viewer img{max-width:100%;height:auto;display:block;margin:0 auto}
#viewer a.lk{display:inline-block;padding:.7em 1.4em;background:var(--org);color:var(--ink);border:2px solid var(--ink);text-decoration:none;border-radius:999px;font-weight:700}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));z-index:70;background:var(--ink);color:#fff;padding:.6em 1.1em;border-radius:999px;font-size:.9rem;display:none;max-width:92vw}
#toast.show{display:block}
/* ===== 聖誕：雪人 + 聖誕老人 ===== */
.sm{display:inline-block;line-height:0;transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
.sm .arm{transform-origin:35px 40px;animation:wave 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
@keyframes wave{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-26deg)}}
body.calm .sm,body.calm .sm .arm,body.calm #santa .bob{animation:none}
@media(prefers-reduced-motion:reduce){.sm,.sm .arm,#santa .bob{animation:none}}
.xmas{text-align:center;margin-top:30px;padding:8px 0 4px}
.xmas .row{display:flex;justify-content:center;align-items:flex-end;gap:14px}
.xmas .hand{margin-top:6px;font-size:1.05rem}
.xtag{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 .6em;font-size:.8rem;font-weight:700;white-space:nowrap}
#santa{position:fixed;left:0;top:120px;z-index:16;pointer-events:none;width:220px;will-change:transform}
#santa .bob{animation:fly 1.6s ease-in-out infinite;line-height:0}
@keyframes fly{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
#santa .ho{position:absolute;left:46px;top:-18px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:0 .55em;font-size:.82rem;font-weight:700;white-space:nowrap}
@media(min-width:760px){html{--fs:18px}}
</style>
</head>
<body>
<div id="head"></div>
<div id="stick" class="stick"></div>
<main id="app" class="wrap"></main>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="viewer"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ 設定：雲端資料庫網址（見說明，貼在引號中）============ */
const DB_URL = 'https://osaka-kyoto-3fa49-default-rtdb.asia-southeast1.firebasedatabase.app';
const ROOT   = 'osaka-kyoto-2026-m4x7q';   // 資料夾名稱（當作簡易密碼，別人猜不到）

/* ============ 基本 ============ */
const COLORS = ['#EF5B72','#F5A623','#2FA67A','#2C9BD6','#A767D6'];   // 旅伴小圓點顏色
const ICONS = {
  fan:`<path class="o" d="M24 44 L4 18 A32 32 0 0 1 44 18 Z"/><path d="M24 44 L24 11 M24 44 L13 14 M24 44 L35 14"/>`,

  tsubaki:`<g fill="#D9482B"><circle cx="24" cy="12" r="9"/><circle cx="35" cy="20" r="9"/><circle cx="31" cy="33" r="9"/><circle cx="17" cy="33" r="9"/><circle cx="13" cy="20" r="9"/></g><circle cx="24" cy="24" r="6" fill="#F5C842"/><path d="M24 24 L24 21 M24 24 L27 25 M24 24 L21 25"/>`,
  nanten:`<path d="M24 44 C24 30 22 20 14 8 M24 44 C25 32 30 22 38 12 M24 36 C20 30 12 28 6 28"/><g fill="#D9482B"><circle cx="14" cy="10" r="4.2"/><circle cx="20" cy="14" r="4.2"/><circle cx="9" cy="16" r="4.2"/><circle cx="38" cy="13" r="4.2"/><circle cx="32" cy="18" r="4.2"/><circle cx="7" cy="29" r="4.2"/></g>`,
  nabe:`<path d="M16 15 Q14 11 16 7 M24 15 Q22 11 24 7 M32 15 Q30 11 32 7"/><path class="o" d="M5 22 H43 C43 36 35 44 24 44 C13 44 5 36 5 22Z"/><path d="M2 22 H46"/><path class="w" d="M13 27 Q24 31 35 27 Q33 37 24 38 Q15 37 13 27Z"/>`,
  flake:`<g class="w"><path d="M24 3 V45 M5.8 13.5 L42.2 34.5 M42.2 13.5 L5.8 34.5"/><path d="M19 8 L24 13 L29 8 M19 40 L24 35 L29 40"/></g><circle class="o" cx="24" cy="24" r="4.5"/>`,
  dango:`<g transform="rotate(25 24 24)"><path d="M24 2 V46"/><circle class="o" cx="24" cy="12" r="8.5"/><circle class="w" cx="24" cy="24" r="8.5"/><circle class="o" cx="24" cy="36" r="8.5"/></g>`,
  matcha:`<path d="M18 13 Q16 9 18 5 M27 13 Q25 9 27 5"/><path class="o" d="M7 21 H41 C41 34 33 43 24 43 C15 43 7 34 7 21Z"/><ellipse class="w" cx="24" cy="21" rx="17" ry="4.5"/><path d="M16 46 H32"/>`,
  umbrella:`<path class="o" d="M3 26 A21 21 0 0 1 45 26 Q39 22 34.5 26 Q29 22 24 26 Q19 22 13.5 26 Q9 22 3 26Z"/><path d="M24 5 V2 M24 26 V42 Q24 46 20 46 M24 5 Q15 10 13.5 26 M24 5 Q33 10 34.5 26"/>`,
  plane:`<g transform="rotate(45 24 24)"><path class="o" d="M24 3 C26 3 27 6 27 9 V18 L44 28 V33 L27 28 V38 L33 43 V46 L24 44 L15 46 V43 L21 38 V28 L4 33 V28 L21 18 V9 C21 6 22 3 24 3Z"/></g>`,
  globe:`<circle class="o" cx="24" cy="24" r="16"/><path d="M8 24 H40 M24 8 C16 16 16 32 24 40 M24 8 C32 16 32 32 24 40"/><ellipse cx="24" cy="24" rx="22" ry="7" transform="rotate(-20 24 24)"/>`,
  train:`<rect class="o" x="9" y="5" width="30" height="32" rx="7"/><rect class="w" x="13" y="10" width="22" height="13" rx="3"/><circle class="w" cx="16" cy="30" r="2.2"/><circle class="w" cx="32" cy="30" r="2.2"/><path d="M14 37 L10 44 M34 37 L38 44 M5 44 H43"/>`,
  deer:`<ellipse class="w" cx="10" cy="24" rx="6.5" ry="3" transform="rotate(-25 10 24)"/><ellipse class="w" cx="38" cy="24" rx="6.5" ry="3" transform="rotate(25 38 24)"/><path d="M18 20 L14 8 M14 8 L9 5 M14 14 L9 13 M30 20 L34 8 M34 8 L39 5 M34 14 L39 13"/><path class="w" d="M14 21 Q24 17 34 21 Q37 34 24 43 Q11 34 14 21Z"/><circle cx="19" cy="29" r="1.6" fill="#2B2B2B"/><circle cx="29" cy="29" r="1.6" fill="#2B2B2B"/><ellipse class="o" cx="24" cy="38" rx="4" ry="2.6"/>`,
  car:`<path class="o" d="M3 31 L8 22 Q10 18 14 18 H32 Q36 18 39 22 L45 29 V35 H3Z"/><path class="w" d="M12 22 H21 V28 H9Z M25 22 H32 L37 28 H25Z"/><circle class="w" cx="14" cy="35" r="5"/><circle class="w" cx="35" cy="35" r="5"/>`,
  suitcase:`<rect class="o" x="5" y="14" width="38" height="29" rx="5"/><path d="M17 14 V9 Q17 7 19 7 H29 Q31 7 31 9 V14 M5 27 H43 M18 27 V31 M30 27 V31"/>`,
  pin:`<path class="o" d="M24 45 C14 32 10 26 10 19 A14 14 0 0 1 38 19 C38 26 34 32 24 45Z"/><circle class="w" cx="24" cy="19" r="5"/>`,
  ticket:`<path class="o" d="M4 12 H44 V20 A4 4 0 0 0 44 28 V36 H4 V28 A4 4 0 0 0 4 20Z"/><path d="M32 12 V36" stroke-dasharray="3 3"/>`,
  check:`<rect class="w" x="7" y="5" width="34" height="38" rx="5"/><path d="M14 16 L17 19 L22 13 M14 30 L17 33 L22 27 M27 17 H35 M27 31 H35"/>`,
  note:`<path class="w" d="M7 6 H37 V42 H7Z"/><path d="M13 15 H31 M13 23 H31 M13 31 H23"/><path class="o" d="M29 41 L40 23 L45 26 L34 44 L27 45Z"/>`,
};
const ic = (n, sz = 24) => `<svg class="ic" viewBox="0 0 48 48" width="${sz}" height="${sz}" aria-hidden="true">${ICONS[n]}</svg>`;
const snowman = (sz = 56, delay = 0) => `<span class="sm" style="animation-delay:${delay}s"><svg class="ic" viewBox="-2 -2 54 62" width="${sz}" height="${Math.round(sz*62/54)}" aria-hidden="true">
<path d="M13 40 L3 30 M3 30 L1 25 M3 30 L-1 31"/>
<g class="arm" style="animation-delay:${delay}s"><path d="M35 40 L45 29 M45 29 L47 24 M45 29 L49 30"/></g>
<circle cx="24" cy="44" r="12" fill="#fff"/><circle cx="24" cy="22" r="9.5" fill="#fff"/>
<path d="M14.5 17 Q15 3 31 5 L34 17Z" fill="#D9482B"/><ellipse cx="24.5" cy="17" rx="11" ry="3" fill="#fff"/><circle cx="31.5" cy="4.5" r="3.2" fill="#fff"/>
<circle cx="20" cy="22" r="1.2" fill="#2B2B2B"/><circle cx="28" cy="22" r="1.2" fill="#2B2B2B"/>
<path d="M24 25 L33 27 L24 28Z" fill="#F5A623"/>
<path d="M13 31 Q24 38 35 31 L35 35 Q24 42 13 35Z" fill="#D9482B"/>
<path d="M30 38 L32 49 L38 47 L35 36" fill="#D9482B"/>
<circle cx="24" cy="44" r="1.3" fill="#2B2B2B"/><circle cx="24" cy="50" r="1.3" fill="#2B2B2B"/>
</svg></span>`;
const deer = dx => `<g transform="translate(${dx},0)"><path d="M10 44 L2 56 M17 45 L12 58 M31 45 L40 54 M37 42 L48 49"/><path d="M8 36 Q3 31 6 26"/><ellipse cx="24" cy="38" rx="16" ry="8" fill="#C98A4B"/><path d="M34 34 L43 25" stroke-width="5"/><circle cx="47" cy="22" r="6" fill="#C98A4B"/><circle cx="52" cy="24" r="2.6" fill="#D9482B"/><circle cx="46" cy="20" r="1" fill="#2B2B2B"/><path d="M44 17 L42 7 M42 7 L38 4 M42 11 L38 10 M48 16 L50 6 M50 6 L54 3"/></g>`;
const SANTA_SVG = `<svg class="ic" viewBox="0 0 262 70" width="220" height="59" aria-hidden="true">

/* ============ 雲端同步 ============ */
const online = !!DB_URL;
const url = p => `${DB_URL.replace(/\/$/,'')}/${ROOT}/${p}.json`;
async function rget(p){ const r = await fetch(url(p), {cache:'no-store'}); if (!r.ok) throw new Error(r.status); return r.json(); }
async function rput(p, v){ const r = await fetch(url(p), {method:'PUT', body:JSON.stringify(v)}); if (!r.ok) throw new Error(r.status); }

let P, TD, MM;                 // 行程、待辦、備忘
let status = online ? '連線中…' : '未設定雲端';
let lastRaw = '';
const norm = () => {
  P.members = arr(P.members);
  P.days = arr(P.days).map(d => ({...d, items: arr(d.items).map(i => ({...i, who: arr(i.who)}))}));
  P.wish = arr(P.wish).map(i => ({...i, who: arr(i.who)}));
  TD = arr(TD); MM = arr(MM);
};
function applyCache(){ try { const c = JSON.parse(localStorage.getItem(LS)); if (c){ P = c.plan; TD = c.todos; MM = c.memos; norm(); return true; } } catch(e){} return false; }
function writeCache(){ try { localStorage.setItem(LS, JSON.stringify({plan:P, todos:TD, memos:MM})); } catch(e){} }

async function pull(first){
  if (!online) return;
  try {
    const [p, t, m] = await Promise.all([rget('plan'), rget('todos'), rget('memos')]);
    if (!p){ const s = seed(); P = s.plan; TD = s.todos; MM = s.memos; await Promise.all([rput('plan',P), rput('todos',TD), rput('memos',MM)]); }
    else {
      const raw = JSON.stringify([p,t,m]);
      if (!first && raw === lastRaw){ status = '已同步'; renderHead(); return; }
      lastRaw = raw; P = p; TD = t; MM = m;
    }
    norm(); status = '已同步'; writeCache();
    if (!(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render();
  } catch(e){ status = '連不上網路，顯示上次內容'; renderHead(); }
}
async function push(what){
  writeCache();
  if (!online) return true;
  try { await rput(what, what === 'plan' ? P : what === 'todos' ? TD : MM); status = '已同步'; renderHead(); return true; }
  catch(e){ status = '儲存失敗，請確認網路'; renderHead(); toast('儲存失敗，請確認網路後再試一次'); return false; }
}

function onScroll(){
  if (tab !== 'plan') return;
  const top = $('stick').offsetHeight + 30; let cur = null;
  [...P.days.map(d => d.n), 0].forEach(n => { const e = $('day-' + n); if (e && e.getBoundingClientRect().top <= top) cur = n; });
  document.querySelectorAll('#daychips .chip').forEach(c => c.classList.remove('on'));
  const c = cur !== null && $('chip-' + cur);
  if (c){ c.classList.add('on'); const bx = c.parentElement; bx.scrollLeft = c.offsetLeft - bx.clientWidth/2 + c.clientWidth/2; }
}

function compress(file){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1100 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => rej(); img.src = u;
  });
}
async function addTicket(){
  const label = $('t-label').value.trim(), link = $('t-link').value.trim(), file = $('t-file').files[0];
  if (!file && !link){ toast('請選一張圖片，或貼上網址'); return; }
  const t = {label: label || (file ? file.name.replace(/\.[^.]+$/,'') : '連結')};
  try { if (file) t.img = await compress(file); else t.link = link; } catch(e){ toast('這個檔案無法讀取，請用圖片或截圖'); return; }
  draft.tickets.push(t); $('t-label').value = ''; $('t-link').value = ''; $('t-file').value = ''; drawTk(); toast('已加入，記得按「儲存」');
}
async function saveEdit(){
  if (!draft.loaded){ toast('票券還在載入，請稍等'); return; }
  const title = $('f-title').value.trim();
  if (!title){ toast('請輸入名稱'); return; }
  const it = draft.it, newDay = +$('f-day').value;
  Object.assign(it, {title, note:$('f-note').value.trim(), map:$('f-map').value.trim(), nt:draft.tickets.length,
    who:[...document.querySelectorAll('#f-who .chip.on')].map(b => b.dataset.id)});
  if (draft.isNew) (newDay ? P.days.find(d => d.n === newDay).items : P.wish).push(it);
  else {
    const f = findItem(it.id);
    if (!f){ toast('這個項目已被別人刪除'); closeModal(); return; }
    if (f.day === newDay) f.list[f.i] = it;
    else { f.list.splice(f.i, 1); (newDay ? P.days.find(d => d.n === newDay).items : P.wish).push(it); }
  }
  const ok = await push('plan');
  if (ok && online){ try { await rput('tickets/' + it.id, draft.tickets.length ? draft.tickets : null); } catch(e){ toast('票券儲存失敗'); } }
  closeModal(); render(); if (ok) toast('已儲存');
}
function textModal(title, fields, onOk){
  openModal(`<h3>${title}</h3>${fields.map((f,i) => `<label>${f.label}</label>${f.area ? `<textarea id="t-${i}" style="min-height:10em">${esc(f.value)}</textarea>` : `<input id="t-${i}" value="${esc(f.value)}">`}`).join('')}
    <div class="actions"><button data-act="mclose">取消</button><button class="primary" data-act="tok">儲存</button></div>`);
  textModal.ok = async () => { const v = fields.map((_,i) => $('t-'+i).value.trim()); if (!v[0]){ toast('請輸入內容'); return; } const what = onOk(v); closeModal(); render(); await push(what); };
}

/* ============ 票券檢視 ============ */
async function openViewer(id){
  const f = findItem(id); if (!f) return;
  const v = $('viewer');
  v.innerHTML = `<div class="vh"><b>${esc(f.it.title)}</b><button data-act="vclose">關閉</button></div><div class="vb" id="vb">載入中…</div>`;
  v.classList.add('show'); document.body.style.overflow = 'hidden';
  try {
    const ts = arr(await rget('tickets/' + id));
    $('vb').innerHTML = ts.map(t => `<div class="vt"><b>${esc(t.label)}</b>${t.img ? `<img src="${t.img}" alt="">` : `<a class="lk" href="${esc(t.link)}" target="_blank" rel="noopener">開啟連結</a>`}</div>`).join('') || '<p>這個項目還沒有票券</p>';
  } catch(e){ $('vb').innerHTML = '<p>票券載入失敗，請確認網路後再試。</p>'; }
}
function closeViewer(){ $('viewer').classList.remove('show'); $('viewer').innerHTML = ''; document.body.style.overflow = ''; }

/* ============ 操作 ============ */
async function mutate(what, fn){ if (online) await pull(); fn(); render(); await push(what); }
const move = (id, dir) => { const f = findItem(id); const j = f.i + dir; if (j < 0 || j >= f.list.length) return; [f.list[f.i], f.list[j]] = [f.list[j], f.list[f.i]]; };

document.addEventListener('click', async e => {
  if (e.target.id === 'modal'){ closeModal(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, D = b.dataset;
  switch(a){
    case 'tab': tab = id; render(); window.scrollTo(0,0); break;
    case 'font': big = !big; localStorage.setItem('okt-big', big?'1':'0'); document.documentElement.classList.toggle('big', big); render(); break;
    case 'snow': snowToggle(!snowOn); render(); break;
    case 'santa': if (santaEl) toast('聖誕老人已經在路上了 🎅'); else santaFly(true); break;
    case 'editmode': edit = !edit; localStorage.setItem('okt-edit', edit?'1':'0'); render(); break;
    case 'jump': $(id)?.scrollIntoView({behavior:'smooth', block:'start'}); break;
    case 'map': window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(findItem(id).it.map), '_blank'); break;
    case 'view': openViewer(id); break;
    case 'vclose': closeViewer(); break;
    case 'add': openEdit(null, +D.day); break;
    case 'edit': openEdit(id); break;
    case 'del': { const f = findItem(id); if (confirm(`確定要刪除「${f.it.title}」嗎？`)) mutate('plan', () => { const g = findItem(id); if (g) g.list.splice(g.i, 1); }).then(() => { if (online) rput('tickets/' + id, null).catch(() => {}); }); break; }
    case 'up': mutate('plan', () => move(id,-1)); break;
    case 'down': mutate('plan', () => move(id,1)); break;
    case 'daytitle': { const d = P.days.find(x => x.n === +D.day); textModal('當天標題', [{label:'標題', value:d.title}], v => { d.title = v[0]; return 'plan'; }); break; }
    case 'pickwho': b.classList.toggle('on'); break;
    case 'tkadd': addTicket(); break;
    case 'tkdel': draft.tickets.splice(+D.i, 1); drawTk(); break;
    case 'mclose': closeModal(); break;
    case 'msave': saveEdit(); break;
    case 'tok': textModal.ok(); break;
    case 'todoadd': { const v = $('newtodo').value.trim(); if (!v){ toast('請先輸入內容'); break; } mutate('todos', () => TD.push({id:uid(), text:v, done:false})); break; }
    case 'todotoggle': mutate('todos', () => { const t = TD.find(x => x.id === id); if (t) t.done = !t.done; }); break;
    case 'todoedit': { const t = TD.find(x => x.id === id); textModal('編輯待辦', [{label:'內容', value:t.text}], v => { t.text = v[0]; return 'todos'; }); break; }
    case 'tododel': { const t = TD.find(x => x.id === id); if (confirm(`確定要刪除「${t.text}」嗎？`)) mutate('todos', () => { TD = TD.filter(x => x.id !== id); }); break; }
    case 'memoadd': textModal('新增備忘', [{label:'標題', value:''},{label:'內容', value:'', area:true}], v => { MM.push({id:uid(), title:v[0], body:v[1]}); return 'memos'; }); break;
    case 'memoedit': { const m = MM.find(x => x.id === id); textModal('編輯備忘', [{label:'標題', value:m.title},{label:'內容', value:m.body, area:true}], v => { m.title = v[0]; m.body = v[1]; return 'memos'; }); break; }
    case 'memodel': { const m = MM.find(x => x.id === id); if (confirm(`確定要刪除「${m.title}」嗎？`)) mutate('memos', () => { MM = MM.filter(x => x.id !== id); }); break; }
    case 'rename': { const m = P.members.find(x => x.id === id); textModal('旅伴名稱', [{label:'名字', value:m.name}], v => { m.name = v[0]; return 'plan'; }); break; }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newtodo') document.querySelector('[data-act="todoadd"]').click(); });

/* ============ 下雪 ============ */
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const snowPref = localStorage.getItem('okt-snow');
let snowOn = snowPref ? snowPref === '1' : !reduceMotion;
const snowCv = document.createElement('canvas'); snowCv.id = 'snow'; document.body.appendChild(snowCv);
const sg = snowCv.getContext('2d');
let sW = 0, sH = 0, flakes = [], sRaf = 0, sT = 0;
function snowSize(){
  const d = Math.min(window.devicePixelRatio || 1, 2);
  sW = innerWidth; sH = innerHeight; snowCv.width = sW * d; snowCv.height = sH * d; sg.setTransform(d,0,0,d,0,0);
  const n = Math.min(70, Math.round(sW / 9));
  while (flakes.length < n) flakes.push({x:Math.random()*sW, y:Math.random()*sH, r:1.5+Math.random()*3.2, v:.35+Math.random()*.9, ph:Math.random()*6.28, sw:.3+Math.random()*.7});
  flakes.length = n;
}
function snowFrame(){
  sg.clearRect(0,0,sW,sH); sT += .015;
  sg.fillStyle = 'rgba(255,255,255,.96)'; sg.strokeStyle = 'rgba(110,140,175,.55)'; sg.lineWidth = 1;
  for (const f of flakes){
    f.y += f.v * (f.r / 3 + .5); f.x += Math.sin(sT * f.sw + f.ph) * .45;
    if (f.y > sH + 6){ f.y = -6; f.x = Math.random() * sW; }
    if (f.x < -6) f.x = sW + 6;
    if (f.x > sW + 6) f.x = -6;
    sg.beginPath(); sg.arc(f.x, f.y, f.r, 0, 6.283); sg.fill(); sg.stroke();
  }
  sRaf = requestAnimationFrame(snowFrame);
}
function snowToggle(on){
  snowOn = on; localStorage.setItem('okt-snow', on ? '1' : '0');
  cancelAnimationFrame(sRaf); sg.clearRect(0,0,sW,sH);
  if (on){ snowSize(); snowFrame(); setTimeout(() => santaFly(), 2500); santaSchedule(); } else santaStop();
  document.body.classList.toggle('calm', !on);
}
addEventListener('resize', () => { if (snowOn) snowSize(); });
if (snowOn){ snowSize(); snowFrame(); }

/* ============ 聖誕老人（偶爾飛過）============ */
let santaEl = null, santaTimer = 0;
function santaFly(force){
  if (santaEl || (!force && (!snowOn || document.hidden))) return;
  const el = document.createElement('div'); el.id = 'santa';
  el.innerHTML = `<span class="ho hand">Ho Ho Ho!</span><div class="bob">${SANTA_SVG}</div>`;
  el.style.top = ($('stick').offsetHeight + 34 + Math.random() * Math.max(40, innerHeight * .28)) + 'px';
  document.body.appendChild(el); santaEl = el;
  const a = el.animate([{transform:'translateX(-240px)'},{transform:`translateX(${innerWidth + 20}px)`}], {duration: Math.max(9000, innerWidth * 22), easing:'linear'});
  a.onfinish = a.oncancel = () => { el.remove(); if (santaEl === el) santaEl = null; };
}
function santaSchedule(){ clearTimeout(santaTimer); santaTimer = setTimeout(() => { santaFly(); santaSchedule(); }, 28000 + Math.random() * 30000); }
function santaStop(){ clearTimeout(santaTimer); if (santaEl){ santaEl.remove(); santaEl = null; } }
document.body.classList.toggle('calm', !snowOn);
if (snowOn){ setTimeout(() => santaFly(), 5000); santaSchedule(); }

/* ============ 啟動 ============ */
if (!applyCache()){ const s = seed(); P = s.plan; TD = s.todos; MM = s.memos; norm(); }
render();
const td = P.days.find(d => d.date === todayStr());
if (td) setTimeout(() => $('day-' + td.n)?.scrollIntoView({block:'start'}), 80);
pull(true);
setInterval(() => { if (!draft && !$('modal').classList.contains('show') && !document.hidden) pull(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !draft) pull(); });
</script>
