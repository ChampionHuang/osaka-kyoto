<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅遊行程">
<meta name="theme-color" content="#FFFCF5">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>旅遊行程</title>
<style>
:root{--a1:#FF9482;--a2:#D3382F;--bg:#EAF3FA;--sky:#CFE3F3;--ink:#2B2B2B;--org:#F5A623;--orgl:#FFF0CF;--sub:#4A5663;--line:#C8D6E3;--soft:#FFF0CF;--red:#C23A1C;--fs:17px;--stick:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
html.big{--fs:20px}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.hand{font-family:"Yusei Magic","Zen Maru Gothic","PingFang TC","Microsoft JhengHei",sans-serif}
.round{font-family:"Zen Maru Gothic","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:.35em 1em;min-height:42px;cursor:pointer}
button:active{transform:translateY(2px);background:var(--orgl)}
button.primary{background:var(--org);font-weight:700}
button.danger{color:var(--red);border-color:var(--red)}
button.ghost{border-color:transparent;color:var(--sub);background:transparent;min-width:44px}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:.55em .8em;border:2px solid var(--ink);border-radius:14px;background:#fff;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:3px 3px 0 var(--org)}
textarea{min-height:5em;resize:vertical}
label{display:block;font-size:.88rem;color:var(--sub);margin:1em 0 .25em;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.hide{display:none!important}
.small{font-size:.86rem;color:var(--sub)}
.ic{stroke:var(--ink);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none;vertical-align:middle}
.ic .o{fill:var(--ico,var(--org))}
.ic .w{fill:#fff}

#head{background:linear-gradient(var(--sky),var(--bg))}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15;opacity:.62}
.sbtn{white-space:nowrap;min-width:44px}
/* ===== 頂端插畫 ===== */
.art{position:relative;max-width:440px;height:128px;margin:calc(6px + env(safe-area-inset-top)) auto 0}
.art .blob{position:absolute;left:11%;top:6%;width:78%;height:88%}
.art .blob path{fill:var(--org);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.art .dc svg,.art .dc{transition:none}
.art .dc{position:absolute;line-height:0}
.ttl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:62%}
.ttl .oko{font-size:.86rem;transform:rotate(-5deg);display:inline-block;margin-bottom:-.25em;color:var(--ink)}
.ttl h1{margin:0;font-size:1.85rem;line-height:1.1;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;letter-spacing:.04em;font-weight:900}
.ttl .kyo{font-size:.78rem;font-weight:800;letter-spacing:.04em;margin-top:.1em;white-space:nowrap}
.top2{padding:calc(10px + env(safe-area-inset-top)) 0 2px}
.mini{display:flex;align-items:center;gap:.5em}
.mini h1{margin:0;font-size:1.5rem;font-weight:900}
.infobar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:.3em 0;margin-top:2px;flex-wrap:nowrap}
.infobar .cnt{font-size:.84rem;font-weight:700;white-space:nowrap;min-width:0;flex:none;display:inline-flex;align-items:center;padding:3px 0;line-height:1.3}
.infobar .cnt b{font-size:1.15em;line-height:1.25;background:var(--org);border:2px solid var(--ink);border-radius:9px;padding:0 .3em;margin:0 .12em}
.infobar .btns{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;justify-content:flex-end;min-width:0}
.infobar .btns .small{display:none!important}
.infobar .sdot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);flex:none;background:#bbb}
.infobar .sdot.ok{background:#2FA67A}.infobar .sdot.bad{background:#D9482B}
.infobar button,.top2 button{white-space:nowrap}
@media(max-width:380px){.infobar .btns .small{display:none!important}.infobar button,.top2 button{padding:.05em .6em;font-size:.82rem;min-height:40px}.ttl h1{font-size:1.6rem}.infobar .cnt{font-size:.82rem}}
.infobar button,.top2 button{min-height:40px;font-size:.88rem;padding:.05em .8em}
button.on{background:var(--org);font-weight:700}
.banner{background:var(--orgl);border:1.5px solid var(--ink);border-radius:10px;padding:.25em .7em;margin-top:6px;font-size:.84rem}

.stick{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:2px solid var(--ink)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 14px;scrollbar-width:none;max-width:720px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:.15em .95em;font-size:.9rem;white-space:nowrap;line-height:1.2;font-weight:700}
.chip.on{background:var(--org)}
.chip.pk{font-weight:500}
.chip.pk.on{background:var(--orgl);font-weight:700}
.dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;border:1.5px solid var(--ink)}

/* ===== 每一天 ===== */
.day{margin-top:34px;background:#fff;border:2.5px solid var(--ink);border-radius:24px 20px 26px 18px / 20px 26px 18px 24px;box-shadow:5px 5px 0 var(--org);padding:0 12px 12px;scroll-margin-top:var(--stick)}
.dayh{position:sticky;top:var(--stick);z-index:10;margin:0 -12px;background:var(--org);color:var(--ink);border-bottom:2.5px solid var(--ink);border-radius:21px 17px 0 0 / 17px 23px 0 0;padding:.5em 5em .55em 1em;min-height:4.2em;--ico:#fff}
.dayh .row1{display:flex;align-items:center;gap:.55em;flex-wrap:wrap}
.dayh .badge{background:var(--ink);color:#fff;font-size:.9rem;letter-spacing:.08em;padding:.05em .65em;border-radius:999px;transform:rotate(-4deg);display:inline-block}
.dayh .n{font-size:1.45rem;font-weight:900;line-height:1.2}
.dayh .d{font-size:.9rem;font-weight:700}
.dayh .t{font-size:.95rem;font-weight:700;margin-top:.1em}
.dayh .dic{position:absolute;right:.8em;top:50%;transform:translateY(-50%);line-height:0}
.today{box-shadow:5px 5px 0 var(--ink)}
.today .dayh .n::after{content:"今天";margin-left:.5em;font-size:.7rem;background:#fff;border:2px solid var(--ink);padding:.05em .55em;border-radius:999px;vertical-align:.25em}

.items{counter-reset:it}
.item{counter-increment:it;position:relative;padding:.75em .2em .75em 2.7em;border-bottom:1.5px solid var(--line)}
.item:last-child{border-bottom:0}
.item::before{content:counter(it);position:absolute;left:.1em;top:.85em;width:1.8em;height:1.8em;border-radius:50%;background:var(--org);border:2px solid var(--ink);font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.title{font-size:1.02rem;font-weight:500;word-break:break-word}
.note{font-size:.92rem;margin-top:.15em;white-space:pre-wrap;word-break:break-word;color:var(--sub)}
.who{margin-top:.4em;font-size:.88rem;display:flex;flex-wrap:wrap;gap:.3em .5em}
.who>span{border:1.5px solid var(--ink);border-radius:999px;padding:.02em .7em;background:#fff}
.btns2{display:flex;flex-wrap:wrap;gap:7px;margin-top:.6em}
.btns2 button{min-height:42px;font-size:.92rem;padding:.15em .9em;display:inline-flex;align-items:center;gap:.3em}
.empty{color:var(--sub);padding:1em .3em;font-size:.9rem}
.dayfoot{display:flex;flex-wrap:wrap;gap:8px;padding:.9em 0 .2em}

.page{padding-top:12px}
.addrow{display:flex;gap:8px;margin:12px 0}
.addrow input{flex:1}
.todo{display:flex;align-items:center;gap:10px;padding:.55em .8em;margin-top:10px;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--org)}
.todo .tx{flex:1;word-break:break-word}
.todo.done .tx{text-decoration:line-through;opacity:.4}
.ck{flex:none;width:42px;height:42px;min-height:42px;padding:0;font-size:1.1rem;border-radius:50%;display:flex;align-items:center;justify-content:center}
.todo.done .ck{background:var(--org)}
.memo{background:#fff;border:2.5px solid var(--ink);border-radius:20px 16px 22px 14px;padding:.8em 1.1em;margin:14px 0;box-shadow:4px 4px 0 var(--org)}
.memo h3{margin:0 0 .3em;font-size:1.05rem;display:inline-block;background:var(--orgl);padding:0 .6em;border-radius:8px}
.memo .body{white-space:pre-wrap;word-break:break-word;font-size:.92rem}

nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;background:#fff;border:2.5px solid var(--ink);border-radius:24px;display:flex;padding:5px;gap:4px;box-shadow:4px 4px 0 var(--org);max-width:700px;margin:0 auto}
nav button{flex:1;border:2px solid transparent;min-height:56px;font-size:.88rem;color:var(--ink);border-radius:18px;background:transparent;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:.2em}
nav button.on{background:var(--org);border-color:var(--ink);font-weight:800}
nav .bd{display:inline-block;min-width:1.4em;margin-left:.3em;font-size:.72rem;background:var(--ink);color:#fff;border-radius:10px;padding:0 .4em}

#modal{position:fixed;inset:0;z-index:50;background:rgba(43,43,43,.5);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));border:2.5px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0}
.sheet h3{margin:0 0 4px;font-size:1.2rem;font-weight:900}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1}
.fl{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:.3em .3em .3em .8em;margin-top:6px;font-size:.9rem;word-break:break-all}
.tkadd{border:2px solid var(--line);border-radius:16px;padding:.6em .9em .9em;margin-top:8px;background:#fff}

#viewer{position:fixed;inset:0;z-index:60;background:#fff;color:#000;display:none;flex-direction:column}
#viewer.show{display:flex}
#viewer .vh{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:2px solid var(--ink);gap:8px}
#viewer .vb{flex:1;overflow:auto;padding:12px;text-align:center}
#viewer .vt{margin:0 auto 22px;max-width:520px}
#viewer .vt b{display:block;font-size:1.05rem;margin-bottom:8px}
#viewer img{max-width:100%;height:auto;display:block;margin:0 auto}
#viewer a.lk{display:inline-block;padding:.7em 1.4em;background:var(--org);color:var(--ink);border:2px solid var(--ink);text-decoration:none;border-radius:999px;font-weight:700}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));bottom:auto;z-index:80;background:var(--ink);color:#fff;padding:.6em 1.1em;border-radius:999px;font-size:.9rem;display:none;max-width:92vw}
#toast.show{display:block}
/* ===== 聖誕：雪人 + 聖誕老人 ===== */
.sm{display:inline-block;line-height:0;transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
.sm .arm{transform-origin:46px 47px;animation:wave 1.1s ease-in-out infinite}
.cu{overflow:visible;vertical-align:middle;flex:none}
@keyframes bob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
@keyframes wave{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-26deg)}}
body.calm .sm,body.calm .sm .arm,body.calm #santa .bob{animation:none}
@media(prefers-reduced-motion:reduce){.sm,.sm .arm,#santa .bob{animation:none}}
.xmas{text-align:center;margin-top:30px;padding:8px 0 4px}
.xmas .row{display:flex;justify-content:center;align-items:flex-end;gap:6px}
.xmas .hand{margin-top:6px;font-size:1.05rem}
.xtag{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 .6em;font-size:.8rem;font-weight:700;white-space:nowrap}
#santa{position:fixed;left:0;top:120px;z-index:16;pointer-events:none;width:230px;will-change:transform}
#santa .bob{animation:fly 1.6s ease-in-out infinite;line-height:0}
@keyframes fly{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
#santa .ho{position:absolute;left:46px;top:-18px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:0 .55em;font-size:.82rem;font-weight:700;white-space:nowrap}
/* ===== 選單上的小人 ===== */
.treebtn{border:0;background:none;padding:0;min-height:0;line-height:0;cursor:pointer}
.treebtn:active{background:none;transform:scale(.94)}
.tw{animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.2}}
body.calm .tw{animation:none}
/* ABCD-MARK */
#lane{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));height:44px;z-index:29;pointer-events:none;background:linear-gradient(to top,var(--bg) 62%,rgba(255,255,255,0));}
.walker{position:fixed;left:0;top:auto;bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;pointer-events:none;will-change:transform}
.wbtn{pointer-events:auto;border:0;background:none;padding:2px 6px;margin:-2px -6px;min-height:0;min-width:44px;line-height:0;cursor:pointer;display:flex;justify-content:center;transform-origin:50% 100%}
.wbtn:active{background:none}
.stp{display:inline-block;line-height:0;transform-origin:50% 100%;animation:step .5s ease-in-out infinite}
.walker .sm{animation:none}
.walker.stand .stp{animation:none}
@keyframes step{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
.wsay{position:fixed;z-index:67;bottom:calc(126px + env(safe-area-inset-bottom));width:max-content;max-width:210px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:.35em .85em;font-size:.92rem;font-weight:700;line-height:1.45;box-shadow:3px 3px 0 var(--org);opacity:0;transform:translateY(6px) scale(.9);transition:opacity .2s,transform .2s;pointer-events:none}
.wsay.show{opacity:1;transform:none}
.wsay::after{content:"";position:absolute;left:var(--tail,50%);bottom:-8px;width:11px;height:11px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.pgift{position:fixed;z-index:66;pointer-events:none;line-height:0;width:28px;height:28px}
.wsay,#santa .ho,.xmas .hand{font-family:inherit;font-weight:700}
/* ===== 想去・想吃：城市、推薦、附近 ===== */
.ctag{display:inline-block;font-size:.8rem;font-weight:800;color:var(--ink);background:color-mix(in srgb,var(--cc,#888) 28%,#fff);border:2px solid var(--cc,#888);border-radius:999px;padding:0 .6em;margin-right:.45em;vertical-align:.12em;line-height:1.5}
.wtools{padding:.7em 0 .2em}
.wtools .chips{padding:8px 0 2px;margin:0}
.wtools .nearbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:.4em;font-weight:800}
.cdot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--cc,#888);margin-right:.35em;vertical-align:.05em}
.dist{font-size:.86rem;color:var(--red);font-weight:700;margin-top:.1em}
.rec{margin-top:.5em;padding:.45em .7em;background:var(--orgl);border:1.5px solid var(--ink);border-radius:12px;font-size:.86rem;line-height:1.5}
.rec b{font-weight:800}
.rec .btns2{margin-top:.4em}
.rec.weak{background:#fff;color:var(--sub)}
.nrow{padding:.65em 0;border-bottom:1.5px solid var(--line)}
.nrow:last-child{border:0}
.nrow .d{font-size:.84rem;color:var(--sub)}
.nmsg{font-size:.88rem;margin:.6em 0;padding:.5em .7em;border-radius:12px;background:var(--orgl)}
html:not([data-season=winter]) .xm{display:none}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:760px){html{--fs:18px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="gSnow" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#C9DDF0"/></radialGradient>
<radialGradient id="gRed" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FF9482"/><stop offset="1" stop-color="#D3382F"/></radialGradient>
<radialGradient id="gAcc" cx=".35" cy=".3" r=".9"><stop offset="0" style="stop-color:var(--a1)"/><stop offset="1" style="stop-color:var(--a2)"/></radialGradient>
<radialGradient id="gGreen" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#78DDA2"/><stop offset="1" stop-color="#2A9560"/></radialGradient>
<radialGradient id="gBrown" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#E8B67E"/><stop offset="1" stop-color="#A8683A"/></radialGradient>
<radialGradient id="gGold" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFEE9E"/><stop offset="1" stop-color="#F2A21E"/></radialGradient>
<radialGradient id="gBlue" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#96D3F8"/><stop offset="1" stop-color="#2E8FD6"/></radialGradient>
<radialGradient id="gPurple" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#D5B2F4"/><stop offset="1" stop-color="#8A58CF"/></radialGradient>
<radialGradient id="gSkin" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFF0E0"/><stop offset="1" stop-color="#FFC8A0"/></radialGradient>
<radialGradient id="gTan" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#F0D0A0"/><stop offset="1" stop-color="#BE8E52"/></radialGradient>
<radialGradient id="gCarrot" cx=".3" cy=".3" r=".9"><stop offset="0" stop-color="#FFC060"/><stop offset="1" stop-color="#EE7418"/></radialGradient>
<radialGradient id="gNavy" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#6F8BB0"/><stop offset="1" stop-color="#2F4468"/></radialGradient>
<radialGradient id="gGinger" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#E8AE6C"/><stop offset="1" stop-color="#B2692F"/></radialGradient>
</defs></svg>
<div id="head"></div>
<div id="stick" class="stick"></div>
<main id="app" class="wrap"></main>
<div id="lane"></div>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="viewer"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ 設定：雲端資料庫網址（見說明，貼在引號中）============ */
const DB_URL = 'https://osaka-kyoto-3fa49-default-rtdb.asia-southeast1.firebasedatabase.app';
const ROOT   = 'osaka-kyoto-2026-m4x7q';   // 資料夾名稱（當作簡易密碼，別人猜不到）

/* ============ 四季主題 ============ */
const SEASONS = {
  spring:{n:'春', e:'🌸', sub:'KYOTO SPRING', oko:'おこしやす', title:'大阪・京都', fall:'petal', fallName:'花瓣', fallOn:'花瓣飄落中', fallOff:'花瓣停了',
    v:{'--bg':'#FFF5F7','--sky':'#FFD6E2','--org':'#FF9DB5','--orgl':'#FFE3EA','--sub':'#664E58','--line':'#F0CDD6','--soft':'#FFE3EA','--red':'#B8274F'},
    deco:{L:'fan',T1:'sakura',T2:'sakura',R:'torii',B1:'dango',B2:'tea',BR:'pagoda',M:'sakura'}, mascot:'bear',
    say:['春天到了，櫻花開了 🌸','今天適合賞花 🌸','來串三色糰子吧 🍡'], dayBadge:'春'},
  summer:{n:'夏', e:'🌻', sub:'KYOTO SUMMER', oko:'おこしやす', title:'大阪・京都', fall:'firefly', fallName:'螢火蟲', fallOn:'螢火蟲飛舞中', fallOff:'螢火蟲睡了',

  const k = seasonKey(), root = document.documentElement.style;
  for (const sk of SORDER) for (const name of Object.keys(SEASONS[sk].v)) root.removeProperty(name);

  document.documentElement.dataset.season = k;
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', SEASONS[k].v['--sky']);
  const T = TRIP(), days = P && P.days ? P.days.length : 0;
  document.title = `${T.title}${days ? ' ' + days + '日' : ''}｜${SEASONS[k].n}`;

}

async function rget(p){ const r = await fetch(url(p), {cache:'no-store'}); if (!r.ok) throw new Error(r.status); return r.json(); }

let lastRaw = '';
const norm = () => {
  P.members = arr(P.members);
  if (P.trip) P.trip = {...P.trip, cities: arr(P.trip.cities)};
  P.days = arr(P.days).map(d => ({...d, items: arr(d.items).map(i => ({...i, who: arr(i.who)}))}));
  P.wish = arr(P.wish).map(i => ({...i, who: arr(i.who)}));
  TD = arr(TD); MM = arr(MM);
};
function applyCache(){ try { const c = JSON.parse(localStorage.getItem(LS)); if (c){ P = c.plan; TD = c.todos; MM = c.memos; norm(); return true; } } catch(e){} return false; }
function writeCache(){ try { localStorage.setItem(LS, JSON.stringify({plan:P, todos:TD, memos:MM})); } catch(e){} }

async function pull(first){
  if (!online) return;
  try {
    const [p, t, m] = await Promise.all([rget('plan'), rget('todos'), rget('memos')]);
    if (!p){ const s = seed(); P = s.plan; TD = s.todos; MM = s.memos; await Promise.all([rput('plan',P), rput('todos',TD), rput('memos',MM)]); }
    else {
      const raw = JSON.stringify([p,t,m]);
      if (!first && raw === lastRaw){ status = '已同步'; renderHead(); return; }
      lastRaw = raw; P = p; TD = t; MM = m;
    }
    norm(); status = '已同步'; writeCache(); applySeason();
    if (!(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render();
  } catch(e){ status = '連不上網路，顯示上次內容'; renderHead(); }
}
async function push(what){
  writeCache();
  if (!online) return true;
  try { await rput(what, what === 'plan' ? P : what === 'todos' ? TD : MM); status = '已同步'; renderHead(); return true; }
  catch(e){ status = '儲存失敗，請確認網路'; renderHead(); toast('儲存失敗，請確認網路後再試一次'); return false; }
}

function compress(file){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1100 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => rej(); img.src = u;
  });
}
async function addTicket(){
  const label = $('t-label').value.trim(), link = $('t-link').value.trim(), file = $('t-file').files[0];
  if (!file && !link){ toast('請選一張圖片，或貼上網址'); return; }
  const t = {label: label || (file ? file.name.replace(/\.[^.]+$/,'') : '連結')};
  try { if (file) t.img = await compress(file); else t.link = link; } catch(e){ toast('這個檔案無法讀取，請用圖片或截圖'); return; }
  draft.tickets.push(t); $('t-label').value = ''; $('t-link').value = ''; $('t-file').value = ''; drawTk(); toast('已加入，記得按「儲存」');
}

async function saveTrip(){
  const title = $('tr-title').value.trim();
  if (!title){ toast('請輸入大標題'); return; }
  const date = $('tr-date').value, n = Math.max(1, Math.min(30, parseInt($('tr-n').value, 10) || 0));
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('請選出發日期'); return; }
  if (!$('tr-n').value || n !== parseInt($('tr-n').value, 10)){ toast('天數請輸入 1 到 30'); return; }
  const dropping = P.days.length > n ? P.days.slice(n).reduce((a, d) => a + d.items.length, 0) : 0;
  if (P.days.length > n && !confirm(`天數從 ${P.days.length} 天改成 ${n} 天，第 ${n + 1} 天之後會被移除。\n其中 ${dropping} 個項目會移到「想去・想吃」。\n確定嗎？`)) return;
  const v = {title, sub:$('tr-sub').value.trim(), hello:$('tr-hello').value.trim(), short:$('tr-short').value.trim() || title.slice(0, 6)};
  const t = TRIP();
  await mutate('plan', () => {
    P.trip = {...(P.trip || {}), ...v, cities: t.cities};
    const moved = [];
    if (P.days.length > n){ P.days.slice(n).forEach(d => moved.push(...d.items)); P.days = P.days.slice(0, n); }
    while (P.days.length < n) P.days.push({n:P.days.length + 1, date:'', title:'新的一天', items:[]});
    P.days.forEach((d, i) => { d.n = i + 1; d.date = addDays(date, i); });
    if (moved.length) P.wish = P.wish.concat(moved);
  });
  closeModal(); render(); applySeason(); toast('旅程設定已儲存');
}

    el.animate([{transform:'rotate(0)'},{transform:'rotate(-7deg) scale(1.08)'},{transform:'rotate(6deg)'},{transform:'rotate(-3deg)'},{transform:'none'}], {duration:550}));
}
/* ---- 噴禮物：只往上噴、淡出，不會掉下來擋畫面 ---- */
function burstGifts(x, y, n = 8){
  for (let i = 0; i < n; i++){
    const el = document.createElement('div'); el.className = 'pgift';
    el.innerHTML = giftSvg(GCOL[i % 5], 28);
    el.style.left = (x - 14) + 'px'; el.style.top = (y - 14) + 'px';
    document.body.appendChild(el);
    const a = -Math.PI * (.1 + .8 * Math.random()), r = 55 + Math.random() * 75, rot = (Math.random() - .5) * 140;
    const dx = Math.cos(a) * r * 1.15, dy = Math.sin(a) * r;
    el.animate([
      {transform:'translate(0,0) scale(.3) rotate(0deg)', opacity:0},
      {transform:`translate(${dx * .7}px,${dy}px) scale(1) rotate(${rot * .6}deg)`, opacity:1, offset:.4},
      {transform:`translate(${dx}px,${dy + 12}px) scale(.85) rotate(${rot}deg)`, opacity:0}
    ], {duration: 1000 + Math.random() * 350, delay: i * 45, easing:'cubic-bezier(.2,.7,.3,1)', fill:'backwards'}).onfinish = () => el.remove();
  }
}

/* ---- 選單上的小人：好幾個一起走，點了會說話 ---- */
const WSZ = 33, WGAP = 30;
const CAST = [
  {draw: () => elf(WSZ, 0, true),  say: ['跟我送禮去！🎁', '我是穿綠衣服的小精靈 🌲', '今天的禮物我來包！🎀']},
  {draw: () => elf(WSZ, 0, false), say: ['聖誕快樂！🎄', '我負責把行李塞進背包 🧳', '耶～要吃拉麵嗎？🍜']},
  {draw: () => reindeer(WSZ, 0),   say: ['我的鼻子亮不亮？🔴', '雪橇有我，不怕累 🛷', '嗚～好想吃糰子 🍡']},
  {draw: () => snowman(WSZ, 0),    say: ['我不怕冷喔 ❄️', '別把我帶進溫泉啦 ♨️', '幫我拍張照吧 📸']},
  {draw: () => penguin(WSZ, 0),    say: ['我是從南極來的 🐧', '地板好滑，扶好我！🧊', '魚呢？我要吃魚 🐟']},
  {draw: () => ginger(WSZ, 0),     say: ['別咬我，我很香 🍪', '我是薑餅人，抓不到我！🏃', '要不要來塊餅乾？🍪']},
  {draw: () => bear(WSZ, 0),       say: ['抱抱～ 🧸', '我喜歡雪，也喜歡你 ❄️', '今天好冷，一起取暖吧 🧣']},
  {draw: () => minisanta(WSZ, 0),  say: ['Ho Ho Ho！🎅', '你今年有乖乖嗎？🎁', '我偷偷放了禮物在你包包 🎒']},
];
const WSPEED = [{n:'不動', m:0}, {n:'很慢', m:.5}, {n:'慢', m:1}, {n:'中', m:1.8}, {n:'快', m:3}];
const WCOL = [{n:'紅', a:'#FF9482', b:'#D3382F'}, {n:'藍', a:'#96D3F8', b:'#2E8FD6'}, {n:'紫', a:'#D5B2F4', b:'#8A58CF'}, {n:'粉', a:'#FFB6D0', b:'#E8508A'}, {n:'金', a:'#FFEE9E', b:'#F2A21E'}];
const WDEF = {spring:[6, 4, 5, 2], summer:[4, 6, 5, 2], autumn:[2, 6, 5, 4], winter:[0, 1, 2, 3]};
const WNAME = ['小精靈（紅帽）', '小精靈（綠帽）', '麋鹿', '雪人', '企鵝', '薑餅人', '北極熊', '小聖誕老人'];
const WMAX = 5;
let WS = {}; try { WS = JSON.parse(localStorage.getItem('okt-walk')) || {}; } catch(e){}
let wSpeed = Number.isInteger(WS.speed) && WSPEED[WS.speed] ? WS.speed : 2;
let wOnSaved = Array.isArray(WS.on);
let wOn = wOnSaved ? WS.on.filter(i => Number.isInteger(i) && i >= 0 && i < WNAME.length).slice(0, WMAX) : WDEF[seasonKey()].slice();
let wColor = WS.color === -1 ? -1 : (Number.isInteger(WS.color) && WCOL[WS.color] ? WS.color : -1);
const saveWS = () => localStorage.setItem('okt-walk', JSON.stringify({speed:wSpeed, on:(wOnSaved ? wOn : undefined), color:wColor}));
const THEMEACC = {spring:['#FFC2D4', '#E8508A'], summer:['#9BE3F0', '#1AA3C2'], autumn:['#FFB36B', '#C5391B'], winter:['#FF9482', '#D3382F']};
function applyWColor(){ const c = wColor === -1 ? THEMEACC[seasonKey()] : [WCOL[wColor].a, WCOL[wColor].b]; document.documentElement.style.setProperty('--a1', c[0]); document.documentElement.style.setProperty('--a2', c[1]); }
applyWColor();
function seasonSettings(){
  const cur = seasonKey();
  return `<h2 class="round" style="font-size:1.1rem;margin-top:24px">季節主題</h2>
    <div class="small">換整個網頁的顏色、插畫和飄落的東西。只改這支手機，不影響別人。</div>
    <div class="pick" style="margin-top:8px"><button class="chip pk ${SPREF === 'auto' ? 'on' : ''}" data-act="season" data-id="auto">自動（跟著今天的季節）</button></div>
    <div class="pick" style="margin-top:8px">${SORDER.map(k => `<button class="chip pk ${SPREF === k ? 'on' : ''}" data-act="season" data-id="${k}"><span class="dot" style="background:${SEASONS[k].v['--org']};width:1em;height:1em"></span> ${SEASONS[k].e} ${SEASONS[k].n}</button>`).join('')}</div>
    <div class="small" style="margin-top:6px">現在：${SEASONS[cur].e} ${SEASONS[cur].n}${SPREF === 'auto' ? '（自動）' : ''}</div>`;
}
function walkerSettings(){
  return `<h2 class="round" style="font-size:1.1rem;margin-top:24px">小人設定</h2>
    <div class="small">調整選單上走路的小人。只改這支手機，不影響別人。</div>
    <label>走路速度</label><div class="pick">${WSPEED.map((v, k) => `<button class="chip pk ${wSpeed === k ? 'on' : ''}" data-act="wspeed" data-id="${k}">${v.n}</button>`).join('')}</div>
    <label>想看到誰（最多 ${WMAX} 位，點一下選取或取消）${wOnSaved ? ' <a data-act="wreset" style="color:var(--red);text-decoration:underline;cursor:pointer;font-weight:700">恢復預設</a>' : ''}</label><div class="pick">${WNAME.map((n, k) => `<button class="chip pk ${wOn.includes(k) ? 'on' : ''}" data-act="wchar" data-id="${k}">${n}</button>`).join('')}</div>
    <label>帽子與衣服的顏色</label><div class="pick"><button class="chip pk ${wColor === -1 ? 'on' : ''}" data-act="wcolor" data-id="-1">跟著主題</button>${WCOL.map((c, k) => `<button class="chip pk ${wColor === k ? 'on' : ''}" data-act="wcolor" data-id="${k}"><span class="dot" style="background:${c.b};width:1em;height:1em"></span> ${c.n}</button>`).join('')}</div>`;
}
let wks = [], wkBub = null, wkBubT = 0, wkLast = 0, wkClicks = 0;
function chat(w){
  const n = P.members.length ? P.members[Math.floor(Math.random() * P.members.length)].name : '你';
  const common = [`${n}，今天走了幾步呢？👟`, `${n}，笑一個！😊`, `${TRIP().hello}～ ⛩️`, ...SE().say];
  const r = Math.random();
  if (r < .4) return w.cast.say[Math.floor(Math.random() * w.cast.say.length)];
  if (r < .7) return isXmas() ? prize() : prize().replace(/聖誕老人說：/, '').replace('今天的雪景超適合拍照 ✨', '今天的風景超適合拍照 ✨');
  return common[Math.floor(Math.random() * common.length)];
}
function walkerSay(w, msg, ms = 2800){
  if (!wkBub){ wkBub = document.createElement('div'); wkBub.className = 'wsay hand'; document.body.appendChild(wkBub); }
  wkBub.textContent = msg; wkBub.classList.add('show');
  const bw = wkBub.offsetWidth, cx = w.x + WSZ / 2, left = Math.max(8, Math.min(innerWidth - bw - 8, cx - bw / 2));
  wkBub.style.left = left + 'px';
  wkBub.style.setProperty('--tail', Math.max(16, Math.min(bw - 16, cx - left)) + 'px');
  clearTimeout(wkBubT); wkBubT = setTimeout(() => wkBub.classList.remove('show'), ms);
  w.wait = ms;
}
function walkerClick(w){
  wkClicks++;
  const b = w.el.firstChild, r = b.getBoundingClientRect();
  walkerSay(w, chat(w));
  b.animate([{transform:`scaleX(${w.dir}) translateY(0) scale(1)`}, {transform:`scaleX(${w.dir}) translateY(-10px) scale(1.12,.92)`, offset:.4}, {transform:`scaleX(${w.dir}) translateY(0) scale(1)`}], {duration: 420, easing:'ease-out'});
  if (wkClicks % 2 === 0) burstGifts(r.left + r.width / 2, r.top + 6, 8);
}
function laneSync(){ const n = $('nav'), l = $('lane'); if (!n || !l) return; const h = Math.round(n.getBoundingClientRect().height); l.style.bottom = `calc(${8 + h - 2}px + env(safe-area-inset-bottom))`; document.querySelectorAll('.walker').forEach(w => w.style.bottom = `calc(${8 + h + 2}px + env(safe-area-inset-bottom))`); document.body.style.paddingBottom = `calc(${h + 8 + 44 + 16}px + env(safe-area-inset-bottom))`; }
function walkBounds(){ const nr = $('nav').getBoundingClientRect(); return [nr.left + 8, Math.max(nr.left + 8, nr.right - WSZ - 8)]; }
function walkStep(dt){
  const [lo, hi] = walkBounds();
  for (const w of wks){
    const still = reduceMotion || WSPEED[wSpeed].m === 0 || w.wait > 0;
    if (w.wait > 0) w.wait -= dt;
    if (!still){
      w.x += w.dir * w.speed * WSPEED[wSpeed].m * dt;
      if (w.x >= hi){ w.x = hi; w.dir = -1; }
      else if (w.x <= lo){ w.x = lo; w.dir = 1; }
    }
    w.still = still;
  }
  // 彼此保持距離：快碰到就各自轉頭
  const o = wks.slice().sort((a, b) => a.x - b.x);
  for (let k = 0; k < o.length - 1; k++){
    const a = o[k], c = o[k + 1], gap = c.x - a.x;
    if (gap < WGAP){
      const push = (WGAP - gap) / 2; a.x -= push; c.x += push;
      if (a.dir === 1 && c.dir === -1){ a.dir = -1; c.dir = 1; }
      else if (a.dir === c.dir){ if (a.dir === 1){ a.speed = Math.min(a.speed, c.speed); } else { c.speed = Math.min(c.speed, a.speed); } }
    }
  }
  for (const w of wks){
    w.x = Math.max(lo, Math.min(hi, w.x));
    w.el.classList.toggle('stand', w.still);
    w.el.style.transform = `translateX(${w.x}px)`;
    w.el.firstChild.style.transform = `scaleX(${w.dir})`;
  }
}
function walkFrame(t){
  const dt = Math.min(50, t - (wkLast || t)); wkLast = t;
  walkStep(dt);
  requestAnimationFrame(walkFrame);
}
function walkInit(){
  wks.forEach(w => w.el.remove()); wks = [];
  setTimeout(laneSync, 0);
  if (wkBub) wkBub.classList.remove('show');
  const [lo, hi] = walkBounds(), span = Math.max(1, hi - lo), list = wOn.slice().sort();
  list.forEach((ci, i) => {
    const c = CAST[ci];
    const el = document.createElement('div'); el.className = 'walker';
    el.innerHTML = `<button class="wbtn" aria-label="點我，我會說話"><span class="stp" style="animation-delay:${-i * .13}s;animation-duration:${.8 + i * .06}s">${c.draw()}</span></button>`;
    document.body.appendChild(el);
    const w = {el, cast:c, x: lo + span * (i + .5) / list.length - WSZ / 2, dir: i % 2 ? -1 : 1, speed: .014 + (ci % 3) * .005, wait: 0};
    el.firstChild.addEventListener('click', () => walkerClick(w));
    wks.push(w);
  });
}
applySeason(); applyWColor();
walkInit(); requestAnimationFrame(walkFrame);
if (!localStorage.getItem('okt-tip2')){ localStorage.setItem('okt-tip2', '1'); setTimeout(() => { if (!$('modal').classList.contains('show')) toast(`點選單上的小人，他們會說話喔 ${SE().e}`); }, 4000); }

/* ============ 啟動 ============ */
if (!applyCache()){ const s = seed(); P = s.plan; TD = s.todos; MM = s.memos; norm(); }
applySeason();
render();
const td = P.days.find(d => d.date === todayStr());
if (td) setTimeout(() => $('day-' + td.n)?.scrollIntoView({block:'start'}), 80);
pull(true);
setInterval(() => { if (!draft && !$('modal').classList.contains('show') && !document.hidden) pull(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !draft) pull(); });
</script>
</body>
